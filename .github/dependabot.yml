# Monthly update PRs for pinned dependencies, one grouped PR per ecosystem (major updates
# included). PRs target the beta branch: updates reach stable only through a tested beta.
version: 2
updates:
  - package-ecosystem: pip
    directory: /visionstate/backend
    target-branch: beta
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # NumPy 2.4 and newer need an x86-64-v2 CPU; many virtual machines only offer the older
      # baseline (issue #29). CI checks every image on such a CPU (scripts/cpu_probe.py).
      - dependency-name: numpy
        versions: [">=2.4"]

  - package-ecosystem: npm
    directory: /visionstate/frontend
    target-branch: beta
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # svelte-check does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /visionstate
    target-branch: beta
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Python is upgraded deliberately together with the CI test version (see CLAUDE.md).
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
