name: CI

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visionstate/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: visionstate/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache AI model
        uses: actions/cache@v6
        with:
          path: visionstate/backend/models
          key: models-${{ hashFiles('visionstate/backend/visionstate/backbones.json', 'visionstate/backend/visionstate/detectors.json', 'visionstate/backend/visionstate/readers.json') }}
      - run: python -m visionstate.backbones models
      - run: ruff check visionstate tests
      - run: ruff format --check visionstate tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visionstate/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visionstate/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    # UI tests in a real browser, on desktop (mouse) and a phone (touch). See visionstate/frontend/e2e.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: visionstate/backend/requirements*.txt
      - run: pip install -r visionstate/backend/requirements.txt
      - name: Cache AI model
        uses: actions/cache@v6
        with:
          path: visionstate/backend/models
          key: models-${{ hashFiles('visionstate/backend/visionstate/backbones.json', 'visionstate/backend/visionstate/detectors.json', 'visionstate/backend/visionstate/readers.json') }}
      - run: python -m visionstate.backbones models
        working-directory: visionstate/backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visionstate/frontend/package-lock.json
      - working-directory: visionstate/frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            visionstate/frontend/playwright-report
            visionstate/frontend/test-results
          retention-days: 14

  image:
    needs: [backend, frontend, e2e]
    # The check names "image (amd64)" and "image (aarch64)" are required by main's branch protection.
    name: image (${{ matrix.arch }})
    # Each architecture builds and runs on its own hardware (no emulation: several times faster).
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write  # only needed to push images on version tags
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - name: Read version and check the release channel
        id: meta
        run: |
          version=$(grep -E '^version:' visionstate/config.yaml | cut -d '"' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then channel=beta; else channel=latest; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          # main carries stable versions, beta carries beta versions (see scripts/channel.py).
          if [[ "$GITHUB_REF" == refs/heads/main && "$channel" == beta ]]; then echo "::error::main has a beta version"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/heads/beta && "$channel" != beta ]]; then echo "::error::beta has a stable version"; exit 1; fi
          # A release tag must match the version in config.yaml, or Home Assistant would pull a wrong image.
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $version"; exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: visionstate
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          load: true
          tags: visionstate-test:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test (start the image with a real MQTT broker)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker run -d --name mqtt -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          # --init: Home Assistant runs apps with an init process (tini) as PID 1.
          docker run -d --init --name app --platform "$PLATFORM" --network host \
            -e VISIONSTATE_DATA=/tmp/data -e VISIONSTATE_MEDIA=/tmp/media -e VISIONSTATE_MQTT_HOST=127.0.0.1 \
            visionstate-test:ci
          ok=""
          for i in $(seq 1 120); do
            status=$(curl -sf localhost:8099/api/v1/status || true)
            if [ -n "$status" ] && echo "$status" | jq -e '.mqtt.connected and .backbone != null and .backbone_error == ""' >/dev/null; then ok=1; break; fi
            sleep 3
          done
          echo "status: ${status:-none}"
          if [ -z "$ok" ]; then docker logs app; exit 1; fi
          curl -sf localhost:8099/ | grep -q '<div id="app">'
          curl -sf -X POST localhost:8099/api/v1/sensors -H 'Content-Type: application/json' \
            -d '{"name":"Smoke","source_type":"http","source":"http://127.0.0.1:9/x.jpg","states":[{"name":"A"},{"name":"B"}]}' >/dev/null
          docker exec mqtt mosquitto_sub -t 'homeassistant/sensor/visionstate_smoke/state/config' -C 1 -W 60 \
            | jq -e '.options == ["a", "b", "unknown"]'
          docker exec mqtt mosquitto_sub -t 'homeassistant/sensor/visionstate/review_queue/config' -C 1 -W 30 >/dev/null
          # The object detector runs in the image (both architectures) on a real photo.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory visionstate/backend/tests/assets >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8765/beach.jpg && break; sleep 0.5; done
          detect=$(curl -s --max-time 300 -X POST localhost:8099/api/v1/preview/detect -H 'Content-Type: application/json' -d '{"source_type":"http","source":"http://127.0.0.1:8765/beach.jpg"}')
          if ! echo "$detect" | jq -e '[.detections[].key] | index("dog") and index("person")' >/dev/null; then
            echo "detect: ${detect:0:500}"; docker logs app | tail -30; exit 1
          fi
          curl -sf -X POST localhost:8099/api/v1/sensors -H 'Content-Type: application/json' -d '{"name":"Yard","kind":"objects","source_type":"http","source":"http://127.0.0.1:8765/beach.jpg","objects":{"classes":["dog"]}}' >/dev/null
          docker exec mqtt mosquitto_sub -t 'homeassistant/binary_sensor/visionstate_yard/dog/config' -C 1 -W 60             | jq -e '.device_class == "occupancy"' >/dev/null
          docker exec mqtt mosquitto_sub -t 'visionstate/yard/objects/dog/state' -C 1 -W 300 | grep -q ON
          # The number reader runs in the image and reads a drawn LCD.
          read=$(curl -s --max-time 120 -X POST localhost:8099/api/v1/preview/read -H 'Content-Type: application/json' -d '{"source_type":"http","source":"http://127.0.0.1:8765/lcd.png","reading":{"mode":"counter","decimals":1}}')
          if ! echo "$read" | jq -e '.value == "123456.7"' >/dev/null; then echo "read: ${read:0:300}"; docker logs app | tail -30; exit 1; fi
          curl -sf -X POST localhost:8099/api/v1/sensors -H 'Content-Type: application/json' -d '{"name":"Meter","kind":"reading","source_type":"http","source":"http://127.0.0.1:8765/lcd.png","reading":{"mode":"counter","decimals":1,"unit":"kWh","device_class":"energy"}}' >/dev/null
          docker exec mqtt mosquitto_sub -t 'homeassistant/sensor/visionstate_meter/state/config' -C 1 -W 60 | jq -e '.state_class == "total_increasing"' >/dev/null
          docker exec mqtt mosquitto_sub -t 'visionstate/meter/state' -C 1 -W 300 | grep -q '123456.7'
          if docker logs app 2>&1 | grep -q Traceback; then docker logs app; exit 1; fi
          # Home Assistant stops apps with SIGTERM; a non-zero exit code shows up as "Error".
          docker stop -t 30 app
          code=$(docker inspect -f '{{.State.ExitCode}}' app)
          if [ "$code" != "0" ]; then echo "::error::exit code $code after docker stop"; docker logs app | tail -20; exit 1; fi
          echo "smoke test passed"
      - name: Old CPU check (the image works without x86-64-v2)
        # Virtual machines often present a generic CPU (kvm64 / qemu64: SSE3 at most). The probe
        # runs every native library and the app itself under such a CPU; a library built for a
        # newer one refuses to import or dies with "Illegal instruction".
        if: matrix.arch == 'amd64'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static
          docker run --rm -v /usr/bin/qemu-x86_64-static:/qemu:ro -v "$PWD/scripts:/probe:ro" \
            -v "$PWD/visionstate/backend/tests/assets:/assets:ro" visionstate-test:ci \
            /qemu -cpu kvm64 /usr/local/bin/python /probe/cpu_probe.py /assets
      - name: Publish image (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: visionstate
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/oleost/visionstate-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ghcr.io/oleost/visionstate-${{ matrix.arch }}:${{ steps.meta.outputs.channel }}
          cache-from: type=gha,scope=${{ matrix.arch }}

  release:
    # Beta tags only (vX.Y.ZbN): once both images exist, publish the pre-release and move the
    # beta branch to the tagged commit — never earlier, because Home Assistant pulls the image of
    # the version it finds on the branch. Stable releases stay manual (see CLAUDE.md).
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'b')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the pre-release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading {on = 1; next} /^## / {on = 0} on' visionstate/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::no '## $version' entry in visionstate/CHANGELOG.md"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --prerelease --title "$version" --notes-file notes.md
      - name: Fast-forward beta to the tagged commit
        # Not forced: it fails when beta has moved on. It also fails when the release changes a
        # workflow file (this token may not push those) — then push beta by hand.
        run: git push origin "$GITHUB_SHA:refs/heads/beta"
