name: VisionState (beta)
version: "0.6.3b2"
slug: visionstate
description: Teach a local AI to recognise states (open, closed, …), find objects (people, cars, pets) or read numbers in your camera images
url: https://github.com/oleost/VisionState
image: ghcr.io/oleost/visionstate-{arch}
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
panel_icon: mdi:eye-check-outline
panel_title: VisionState β
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
map:
  - type: media
    read_only: false
backup_exclude:
  - "models/*"
watchdog: "http://[HOST]:[PORT:8099]/api/v1/status"
options:
  log_level: info
  discovery_prefix: homeassistant
schema:
  log_level: list(debug|info|warning|error)
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
environment:
  VISIONSTATE_MEDIA: /media/visionstate_beta
