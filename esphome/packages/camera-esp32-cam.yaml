# The ESP32-CAM's OV2640 as a camera entity in Home Assistant and as /snapshot.jpg, and its flash
# LED as a light (off until something switches it on).
packages:
  camera_orientation: !include camera-orientation.yaml  # which way up the picture is

substitutions:
  # The largest picture it can give: every size a sensor asks for fits in it.
  camera_resolution: 1600x1200

esp32_camera:
  id: vs_camera
  name: Camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: ${camera_resolution}
  jpeg_quality: 10
  # A fresh snapshot waits for the camera's next picture, at most 1 / max_framerate after the last
  # (ESPHome's 10 fps made every snapshot 100 ms slower). Idle, idle_framerate applies.
  max_framerate: 25 fps
  # Two buffers: a picture asked for is the newest the camera has (CAMERA_GRAB_LATEST).
  frame_buffer_count: 2
  idle_framerate: 0.1 fps

visionstate_stream:
  camera: vs_camera
  flash: vs_flash  # a snapshot can ask for the flash (?flash=<ms>): VisionState does, for a sensor lit by it
  camera_power_down_pin: 32  # as power_down_pin above: the camera is powered down while firmware is installed

output:
  - platform: ledc
    id: vs_flash_output
    pin: GPIO4
    # Not channel 0: the camera's clock (XCLK) runs on LEDC channel 0 and timer 0, and the flash
    # there took it over, so the camera took no new pictures (only the one it had ready).
    channel: 2
    # Dimmed by switching it on and off this fast: the camera reads its picture a line at a time
    # (about 56 µs a line at 20 MHz), and at ESPHome's 1 kHz each line would catch the LED on or off
    # for a different share of its exposure: stripes across a dimmed picture.
    frequency: 40kHz

light:
  - platform: monochromatic
    id: vs_flash
    name: Flash
    output: vs_flash_output
    restore_mode: ALWAYS_OFF
    # Full at once: ESPHome fades a light in over a second, and pictures taken meanwhile were dark or
    # had a colour cast (the exposure and the white balance followed a light that kept changing).
    default_transition_length: 0s
    # Brightness is the share of the time the LED is on, so half is half the light (ESPHome's default
    # curve, made for eyes, would give a seventh of it at half). A snapshot asks how strong
    # (&flash_level=), half when it does not say.
    gamma_correct: 1.0
