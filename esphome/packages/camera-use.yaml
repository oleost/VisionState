# What the camera looks at, as a choice in Home Assistant (camera-esp32-cam.yaml and
# camera-xiao-esp32s3-sense.yaml include it): the picture size, its JPEG quality and how it is
# exposed, set on the camera at start and when the choice changes, kept over restarts. The camera
# starts at its largest size (camera_resolution), so each choice fits its buffers.
#
# - States: still things (a door, a gate) as before: 800x600, JPEG quality 10, exposure and gain
#   automatic.
# - Meters and displays: every pixel the sensor has (1600x1200) and less compression (8), for the
#   digits; the subject stands still, and the flash lights it.
# - People, cars and animals: 800x600 (the sensor bins pixels there: more light each, more pictures
#   a second), the exposure fixed and short (camera_motion_exposure, a number in Home Assistant:
#   the sensor's lines, about 20 ms at 250) so something moving stays sharp, and the gain automatic
#   up to 16x to keep it bright. Darker and noisier in poor light: a light helps.
substitutions:
  camera_use: States
  camera_motion_exposure: "250"

esphome:
  on_boot:
    priority: -100  # after the camera started
    then:
      - script.execute: vs_apply_camera_use

select:
  - platform: template
    id: vs_camera_use
    name: Camera use
    icon: mdi:camera-iris
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - States
      - Meters and displays
      - People, cars and animals
    initial_option: ${camera_use}
    on_value:
      - script.execute: vs_apply_camera_use

number:
  - platform: template
    id: vs_motion_exposure
    name: Exposure for moving things
    icon: mdi:camera-timer
    entity_category: config
    min_value: 30
    max_value: 1200
    step: 10
    optimistic: true
    restore_value: true
    initial_value: ${camera_motion_exposure}
    on_value:
      - script.execute: vs_apply_camera_use

script:
  - id: vs_apply_camera_use
    mode: queued
    then:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s == nullptr) {
            ESP_LOGW("visionstate", "No camera to set up");
            return;
          }
          const std::string use = id(vs_camera_use).current_option();
          if (use == "Meters and displays") {
            s->set_framesize(s, FRAMESIZE_UXGA);
            s->set_quality(s, 8);
            s->set_exposure_ctrl(s, 1);
            s->set_ae_level(s, 0);
            s->set_gain_ctrl(s, 1);
            s->set_gainceiling(s, GAINCEILING_4X);
          } else if (use == "People, cars and animals") {
            s->set_framesize(s, FRAMESIZE_SVGA);
            s->set_quality(s, 10);
            s->set_exposure_ctrl(s, 0);
            s->set_aec_value(s, (int) id(vs_motion_exposure).state);
            s->set_gain_ctrl(s, 1);
            s->set_gainceiling(s, GAINCEILING_16X);
          } else {
            s->set_framesize(s, FRAMESIZE_SVGA);
            s->set_quality(s, 10);
            s->set_exposure_ctrl(s, 1);
            s->set_ae_level(s, 0);
            s->set_gain_ctrl(s, 1);
            s->set_gainceiling(s, GAINCEILING_4X);
          }
          ESP_LOGI("visionstate", "Camera use: %s", use.c_str());
