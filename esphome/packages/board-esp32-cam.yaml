# A generic ESP32-CAM (the AI-Thinker layout and its clones), with 4 MB PSRAM.
substitutions:
  light_pin: GPIO33       # the small red LED on the back (on when low)
  light_inverted: "true"
  # An INMP441 on the SD card's pins (no SD card then).
  mic_sck: GPIO14
  mic_ws: GPIO15
  mic_sd: GPIO13
  mute_pin: GPIO12        # a strapping pin: only a switch to GND, never anything that pulls it up

esp32:
  board: esp32cam
  framework:
    type: esp-idf

psram:
