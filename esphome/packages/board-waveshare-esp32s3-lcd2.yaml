# A Waveshare ESP32-S3-Touch-LCD-2: an ESP32-S3R8 (8 MB octal PSRAM) with 16 MB flash, a 2" display
# (left dark: not used) and a camera socket. An INMP441 on its headers, as a user wired it: SCK and
# WS on the UART pins (GPIO43, GPIO44), so the log goes over USB; SD on GPIO12, one of the camera's
# pins, so with a camera in the socket SD goes to GPIO18 instead. It has no LED of its own to light
# while someone listens, and no mute switch (no pin left that is known to be free).
substitutions:
  mic_sck: GPIO43         # INMP441 SCK: TX on the P2 header
  mic_ws: GPIO44          # INMP441 WS: RX on the P2 header
  mic_sd: GPIO12          # INMP441 SD: P2 header; GPIO18 (P1 header) with a camera in the socket

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG  # not UART0: its pins are the microphone's

# The light that is on while someone listens or looks (packages/common.yaml switches it): this board
# has none, so nothing lights.
output:
  - platform: template
    id: vs_light
    type: binary
    write_action: []
