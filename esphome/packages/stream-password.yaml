# The stream's password, for VisionState: it calls this action through Home Assistant
# (esphome.<device>_stream_password, with a response) when a sensor is made from the device, so
# nobody has to look for stream_password in the device's file. The answer has the device's address
# too, so VisionState can tell it asked the right device. Anyone who may call actions in Home
# Assistant can ask for it, as anyone who may install firmware on the device can read it already.
api:
  actions:
    - action: stream_password
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["password"] = id(vs_stream).get_password();
              char address[network::IP_ADDRESS_BUFFER_SIZE] = "";
              for (auto &ip : network::get_ip_addresses()) {
                if (ip.is_ip4()) {
                  ip.str_to(address);
                  break;
                }
              }
              root["address"] = address;
