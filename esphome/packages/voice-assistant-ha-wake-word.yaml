# A voice assistant on a VisionState microphone (microphone.yaml): the wake word is heard by Home
# Assistant (use_wake_word: its pipeline needs a wake word engine, such as openWakeWord), so it
# also runs on an ESP32 without PSRAM. The device has no speaker: the answer is played on a media
# player in Home Assistant (a Chromecast, a Music Assistant player…), which needs "Allow the device
# to perform Home Assistant actions" on the device in Home Assistant. Which one is *Answer on* on the
# device, kept over restarts and changed in Home Assistant or on VisionState's Live tab without
# installing again; assistant_media_player is the one it starts with (empty: none yet, no answer
# played).
# The microphone is shared: its Microphone switch and mute switch mute both. From the wake word until
# the answer is done the stream carries silence (VisionState pauses for the assistant turns that off).
# VisionState stream (stream-switch.yaml) switches VisionState's stream off and leaves the assistant on.
packages:
  stream_switch: !include stream-switch.yaml

substitutions:
  assistant_media_player: ""  # the player it starts with (Answer on): the device's own file sets it
  assistant_gain: "4"

voice_assistant:
  id: vs_assistant
  microphone:
    microphone: vs_microphone
    gain_factor: ${assistant_gain}
  use_wake_word: true
  on_client_connected:
    - voice_assistant.start_continuous:
  on_client_disconnected:
    - voice_assistant.stop:
  on_wake_word_detected:
    - lambda: if (id(vs_pause_for_assistant).state) id(vs_stream).set_paused(true);
  on_tts_end:
    - if:
        condition:
          lambda: return !id(vs_answer_on).state.empty();
        then:
          - homeassistant.action:
              action: media_player.play_media
              data:
                entity_id: !lambda return id(vs_answer_on).state;
                media_content_id: !lambda return x;
                media_content_type: music
                announce: "true"
  on_end:
    - lambda: id(vs_stream).set_paused(false);
  on_error:
    - lambda: id(vs_stream).set_paused(false);

text:
  - platform: template
    id: vs_answer_on
    name: Answer on
    icon: mdi:speaker
    entity_category: config
    mode: text
    max_length: 100
    optimistic: true
    restore_value: true
    initial_value: "${assistant_media_player}"

switch:
  - platform: template
    id: vs_pause_for_assistant
    name: VisionState pauses for the assistant
    icon: mdi:microphone-message-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - lambda: id(vs_stream).set_paused(false);
