# The XIAO ESP32-S3 Sense's camera as a camera entity in Home Assistant and as /snapshot.jpg. The
# board has no flash LED. On the S3 the camera has a peripheral of its own (not I2S), so the
# microphone needs no port kept for it.
substitutions:
  camera_resolution: 800x600

esp32_camera:
  id: vs_camera
  name: Camera
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13
  resolution: ${camera_resolution}
  jpeg_quality: 10
  # Two buffers: a picture asked for is the newest the camera has (CAMERA_GRAB_LATEST).
  frame_buffer_count: 2
  idle_framerate: 0.1 fps

visionstate_stream:
  camera: vs_camera
