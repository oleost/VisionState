# The XIAO ESP32-S3 Sense's camera as a camera entity in Home Assistant and as /snapshot.jpg. The
# board has no flash LED. On the S3 the camera has a peripheral of its own (not I2S), so the
# microphone needs no port kept for it.
packages:
  camera_orientation: !include camera-orientation.yaml  # which way up the picture is

substitutions:
  # The largest picture it can give: every size a sensor asks for fits in it.
  camera_resolution: 1600x1200

# The camera's control bus, a bus of its own (esp32_camera's i2c_pins is deprecated, and fails
# next to a device file's own i2c: block). A list: a device file's own i2c: written as a list is
# added to it (one written without the dash replaces it).
i2c:
  - id: vs_camera_i2c
    sda: GPIO40
    scl: GPIO39
    scan: false

esp32_camera:
  id: vs_camera
  name: Camera
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_id: vs_camera_i2c
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13
  resolution: ${camera_resolution}
  jpeg_quality: 10
  # A fresh snapshot waits for the camera's next picture, at most 1 / max_framerate after the last
  # (as on the ESP32-CAM, camera-esp32-cam.yaml). Idle, idle_framerate applies.
  max_framerate: 25 fps
  # One buffer (ESPHome's default): the camera takes a picture when the last one is given back,
  # not all the time. A fresh snapshot throws the one kept away and waits up to one picture for the
  # next; two buffers saved that but kept memory and the camera's bus busy all the time.
  frame_buffer_count: 1
  idle_framerate: 0.1 fps

visionstate_stream:
  camera: vs_camera
