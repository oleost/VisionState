# CI: an ESP32 DevKit with an INMP441 that is also a voice assistant (wake word in Home Assistant,
# the answer on a media player there), built from the packages in this folder.
substitutions:
  name: vs-test-assistant
  friendly_name: Test assistant
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password
  assistant_media_player: media_player.test

external_components:
  - source:
      type: local
      path: ../components

packages:
  board: !include ../packages/board-esp32-devkit.yaml
  common: !include ../packages/common.yaml
  microphone: !include ../packages/microphone.yaml
  assistant: !include ../packages/voice-assistant-ha-wake-word.yaml
