# CI: a Waveshare ESP32-S3-Touch-LCD-2 with an INMP441 (it has no mute pin), built from the packages in this folder.
substitutions:
  name: vs-test-waveshare
  friendly_name: Test Waveshare
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password

external_components:
  - source:
      type: local
      path: ../components

packages:
  board: !include ../packages/board-waveshare-esp32s3-lcd2.yaml
  common: !include ../packages/common.yaml
  microphone: !include ../packages/microphone.yaml
