# CI: a Waveshare ESP32-C5-WIFI6-KIT with an INMP441 and a mute switch, built from the packages in this folder.
substitutions:
  name: vs-test-c5
  friendly_name: Test C5
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password

external_components:
  - source:
      type: local
      path: ../components

packages:
  board: !include ../packages/board-waveshare-esp32c5-kit.yaml
  common: !include ../packages/common.yaml
  microphone: !include ../packages/microphone.yaml
  mute_pin: !include ../packages/mute-pin.yaml
