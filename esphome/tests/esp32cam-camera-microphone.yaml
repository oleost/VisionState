# CI: an ESP32-CAM with an INMP441 on the SD card's pins and a mute switch.
substitutions:
  name: vs-test-camera-microphone
  friendly_name: Test camera and microphone
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password

external_components:
  - source:
      type: local
      path: ../components

packages:
  board: !include ../packages/board-esp32-cam.yaml
  common: !include ../packages/common.yaml
  camera: !include ../packages/camera-esp32-cam.yaml
  reserve_i2s0: !include ../packages/esp32-cam-microphone.yaml
  microphone: !include ../packages/microphone.yaml
  mute_pin: !include ../packages/mute-pin.yaml
