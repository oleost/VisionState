# CI: an ESP32 DevKit with its INMP441 at 48 kHz, taken down to 16 kHz on the device.
substitutions:
  name: vs-test-microphone-48k
  friendly_name: Test microphone 48k
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password
  mic_sample_rate: "48000"

external_components:
  - source:
      type: local
      path: ../components

packages:
  board: !include ../packages/board-esp32-devkit.yaml
  common: !include ../packages/common.yaml
  microphone: !include ../packages/microphone.yaml
