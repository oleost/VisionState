# A microphone for VisionState on a Waveshare ESP32-C5-WIFI6-KIT with an INMP441.
#
# In ESPHome: make a new device for an ESP32-C5 (it writes the name, the Wi-Fi and an API key), then
# replace what it wrote below `esphome:` … `captive_portal:` with the lines from `substitutions:`
# down, keeping its `api:` key. Add `vs_stream_password: <a password>` and
# `vs_ap_password: <8 characters or more>` (its fallback hotspot's) to ESPHome's secrets.
substitutions:
  name: vs-bedroom-microphone
  friendly_name: Bedroom microphone
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password
  ap_password: !secret vs_ap_password
  # The wiring (esphome/README.md): change the pins here if you wired it differently.
  # mic_sck: GPIO8
  # mic_ws: GPIO9
  # mic_sd: GPIO10
  # mute_pin: GPIO4

external_components:
  - source: github://oleost/VisionState@esphome-v1
    refresh: 0s  # the newest of the line at every Install

packages:
  visionstate:
    url: https://github.com/oleost/VisionState
    ref: esphome-v1
    refresh: 0s
    files:
      - esphome/packages/board-waveshare-esp32c5-kit.yaml
      - esphome/packages/common.yaml
      - esphome/packages/microphone.yaml
      - esphome/packages/mute-pin.yaml  # leave this line out if you wire no mute switch

api:
  encryption:
    key: !secret vs_bedroom_microphone_api_key  # or the key ESPHome wrote for the device

ota:
  - platform: esphome
    encryption: {}  # firmware over the air only from whoever has the API key
