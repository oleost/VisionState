# A microphone for VisionState on a generic ESP32 DevKit with an INMP441.
#
# In ESPHome: make a new device for an ESP32 (it writes the name, the Wi-Fi and an API key), then
# replace what it wrote below `esphome:` … `captive_portal:` with the lines from `substitutions:`
# down, keeping its `api:` key. Add `vs_stream_password: <a password>` to ESPHome's secrets.
substitutions:
  name: vs-hallway-microphone
  friendly_name: Hallway microphone
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  stream_password: !secret vs_stream_password
  # The wiring (esphome/README.md): change the pins here if you wired it differently.
  # mic_sck: GPIO26
  # mic_ws: GPIO25
  # mic_sd: GPIO33
  # mute_pin: GPIO32

external_components:
  - source: github://oleost/VisionState@esphome-v1

packages:
  visionstate:
    url: https://github.com/oleost/VisionState
    ref: esphome-v1
    files:
      - esphome/packages/board-esp32-devkit.yaml
      - esphome/packages/common.yaml
      - esphome/packages/microphone.yaml
      - esphome/packages/mute-pin.yaml  # leave this line out if you wire no mute switch

api:
  encryption:
    key: !secret vs_hallway_microphone_api_key  # or the key ESPHome wrote for the device
